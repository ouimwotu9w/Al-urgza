name: Build APK (أرجوزة الملل والنحل)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تجهيز المشروع
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
          pub-cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('al_urjuza/pubspec.lock') }}"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('al_urjuza/pubspec.lock') }}"

      - name: تفعيل كاش Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: تنزيل الحزم
        working-directory: al_urjuza
        run: flutter pub get

      - name: فحص المشروع
        working-directory: al_urjuza
        run: flutter analyze

      - name: بناء APK
        working-directory: al_urjuza
        run: flutter build apk --release

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: al-urjuza-apk
          path: al_urjuza/build/app/outputs/flutter-apk/app-release.apk
